# Panes run zsh as a non-login shell, since the login shell that started tmux has already read the login files
# Ref: https://superuser.com/a/1330842
# Only the shells tmux starts as panes load the tmux zsh module, which reports the shell's state to its pane
# Set in tmux's environment, the variable would reach every process in every pane
set -g default-command "DOTDEV_ZSH_EXTRA_MODULES='{\"tmux\": {}}' exec zsh"

bind -n M-C command-prompt -p "New project name:" "run-shell \",tmux-new-project '%%%'\""
bind -n M-c command-prompt -p "Window name:" "new-window -n '%%'"

# Only windows can be renamed, since a session's name is its project's folder
# Ref: https://www.reddit.com/r/tmux/comments/4red05/cant_rebind_r_to_renamewindow_in_tmuxconf_any_help
bind -n M-r command-prompt -I "#W" "rename-window '%%'"

# White borders are hard to see between panes full of text
# Ref: https://unix.stackexchange.com/a/141252
set -g pane-border-style fg=magenta
# A pane that runs something other than our shell stands out from the shells by its border colors
set -g @special_pane '#{&&:#{@pane_type},#{!=:#{@pane_type},zsh}}'
set -ga pane-border-style "#{?#{E:@special_pane},fg=colour33,}"
set -ga pane-active-border-style "#{?pane_in_mode,,#{?synchronize-panes,,#{?#{E:@special_pane},fg=colour208,}}}"

# tmux otherwise waits after Esc for the rest of a key code, which makes a lone Esc slow
# Ref: https://superuser.com/questions/942677
set -sg escape-time 0

# Ref: https://superuser.com/questions/1287428
unbind C-b
set-option -g prefix M-a
bind M-a send-prefix

# Vim-like pane navigation
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# Vim-like window and session navigation
bind -n M-L next-window
bind -n M-H previous-window
bind -n M-J switch-client -n
bind -n M-K switch-client -p

# Vim-like pane splits
bind -n M-s split-window -v
bind -n M-v split-window -h
# The capital keys split a pane and keep its directory and zsh modules
# The directory comes from the shell, since tmux's own pane path has its symlinks resolved
# The modules are read with show-options, since #{@zsh_extra_modules} would lose its double quotes on the way into the environment
bind -n M-S run-shell "tmux split-window -v 'cd #{q:@cwd}; DOTDEV_ZSH_EXTRA_MODULES=$(tmux show-options -t #{pane_id} -pv @zsh_extra_modules) exec zsh'"
bind -n M-V run-shell "tmux split-window -h 'cd #{q:@cwd}; DOTDEV_ZSH_EXTRA_MODULES=$(tmux show-options -t #{pane_id} -pv @zsh_extra_modules) exec zsh'"

# -b puts the pane above or to the left of the target, which is the only way to move it there
# Ref: https://stackoverflow.com/a/70024796/8245426
bind -n M-left move-pane -bv -t '.{left-of}'
bind -n M-down move-pane -bh -t '.{down-of}'
bind -n M-up move-pane -h -t '.{up-of}'
bind -n M-right move-pane -v -t '.{right-of}'
bind -n M-C-left resize-pane -L 2
bind -n M-C-down resize-pane -D 2
bind -n M-C-up resize-pane -U 2
bind -n M-C-right resize-pane -R 2

# Ref: https://superuser.com/a/552493
bind-key -n M-< swap-window -t -1\; select-window -t -1
bind-key -n M-> swap-window -t +1\; select-window -t +1

# Vim-like quit
bind -n M-q run-shell ',tmux-quit-pane'
bind -n M-Q run-shell ',tmux-quit-session'

bind -n M-? run-shell ',tmux-display-pane-info'
bind -n M-x run-shell ',tmux-kill-pane-command'

set -g detach-on-destroy off

# Vim-like copy mode, the way vim leaves a terminal for normal mode
bind -n M-n copy-mode  # n stands for normal
bind -T copy-mode-vi 'i' send-keys -X cancel  # i stands for insert

# Vim-like text selection
bind -T copy-mode-vi v send-keys -X rectangle-off \; send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-on \; send-keys -X begin-selection

# tmux pastes only from its own buffers, and send-keys cannot read stdin, so the clipboard goes through a buffer that the paste deletes
# -p pastes the clipboard as one bracketed paste, which zsh and Claude Code take in whole, newlines included
bind -n  M-p run-shell ',clipboard read | tmux load-buffer -b clipboard -' \; paste-buffer -p -b clipboard -d
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel ',clipboard write'

# The project's workstation next to the current pane, at most one per session
bind -n M-w run-shell ',tmux-open-workstation'
bind -n M-C-p run-shell ',tmux-ssh-put'
bind -n M-C-y run-shell ',tmux-ssh-yank'

bind -n M-: command-prompt
bind -n M-z resize-pane -Z

# Each pane shows its title on its top border
# Ref: https://stackoverflow.com/a/37602055
# Ref: https://github.com/tmux/tmux/issues/733#issuecomment-358632846
set -g pane-border-status top
# A pane that runs something other than our shell shows its type instead, and the machine it is connected to if any
set -g pane-border-format '#{?#{E:@special_pane},#{@pane_type}#{?@ssh_workstation,: #{@ssh_workstation},},#{pane_title}}'

# tmux does not take vi keys from VISUAL or EDITOR, so they are set here
# Ref: https://github.com/tmux/tmux/issues/305
# Ref: https://superuser.com/a/1562662
# Ref: https://unix.stackexchange.com/a/412614
set -g mode-keys vi
set -g status-keys vi

set -g history-limit 20000

bind -n M-m run-shell ',tmux-lasso-mark'
bind -n M-M display-popup -E ',tmux-lasso-edit'
bind -n M-F1 run-shell ',tmux-lasso-switch 1'
bind -n M-F2 run-shell ',tmux-lasso-switch 2'
bind -n M-F3 run-shell ',tmux-lasso-switch 3'
# No M-F4, which closes the terminal on Windows
# Home session, created again if it was killed
bind -n M-Home run-shell ",tmux-open-session '~'"

# Project picker, newest visit first
bind -n M-/ display-popup -E ',tmux-session-picker'
# Opening a session is a visit, which orders M-/, and only a project keeps a visit file
set-hook -g client-session-changed "run-shell 'touch -c #{q:session_path}/$DOTDEV_ATDIR/tmux-session-visit'"

# Long session names keep their start and end, and every name takes the same width, so the window list stays put
# q: escapes every shell character but ~, so the empty quotes keep the home session's name from expanding to the home path
# Ref: https://github.com/tmux/tmux/blob/30cf692c2241440efad9a3212443a45aaa719a10/format.c#L4485
set -g status-left "[#(hburger hash -l 3 -c 2 -r 3 -p ' ' -- ''#{q:session_name})] "
set -g status-left-length 11

# What the modules add, CPU, memory and disk load, then the time
set -g status-right "#{E:@module_status}#(,tmux-format-load) %H:%M %d-%b-%y"

source-file ~/.tmux-modules/*.tmux.conf

# In key names, C- is Ctrl and M- is Alt
# Ref: https://unix.stackexchange.com/a/140010
# bind -n binds a key that works without the prefix
# Ref: https://superuser.com/a/240972
