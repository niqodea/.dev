# Claude Code next to the current pane, at most one per session
bind -n M-\; run-shell ',tmux-open-claude'
# Sessions whose Claude waits for us, in place of the pane title, which the pane border already shows
set -g status-right '#{S:#{W:#{P:#{?#{&&:#{==:#{@pane_type},claude},#{==:#{@status},idle}},claude:#{session_name} ,}}}}%H:%M %d-%b-%y'
# Sessions whose Claude waits for us, landing on that Claude
bind -n M-\' display-popup -E ',tmux-pick-waiting-claude'
