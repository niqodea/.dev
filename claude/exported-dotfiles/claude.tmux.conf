# Claude Code next to the current pane, at most one per session
bind -n M-\; run-shell ',tmux-open-claude'
# The session's Claude's conversation in a view, since the screen has the lines Claude Code wrapped
# Appending would split the command at its comma, so the alias takes an index of its own, past tmux's defaults
set -s command-alias[100] 'view-claude-transcript=run-shell ,tmux-view-claude-transcript'
# Whether a pane is a Claude that waits for us
set -g @waiting_claude '#{&&:#{==:#{@pane_type},claude},#{==:#{@status},idle}}'
# A workstation pane mirrors since when the Claude of its session on the workstation waits, empty while none waits
set -g @workstation_mirror_claude_idle_since '#{W:#{P:#{?#{E:@waiting_claude},#{@claude_idle_since},}}}'
# Whether a pane is a workstation pane whose session there has a Claude that waits for us
set -g @waiting_workstation_claude '#{&&:#{==:#{@pane_type},workstation},#{@workstation_claude_idle_since}}'
set -g @waiting_any_claude '#{||:#{E:@waiting_claude},#{E:@waiting_workstation_claude}}'
# Show the key that reaches a waiting Claude: ; for the Claude in this session, w for the one on its workstation, ' for a Claude in another session
# When the Claude here and the one on the workstation both wait, show ;
# Show three spaces when no Claude waits, so whatever we add before them stays put
set -ga @module_status "#{?#{W:#{P:#{?#{E:@waiting_claude},x,}}}, #[reverse];#[noreverse] ,#{?#{W:#{P:#{?#{E:@waiting_workstation_claude},x,}}}, #[reverse]w#[noreverse] ,#{?#{S:#{W:#{P:#{?#{E:@waiting_any_claude},x,}}}}, #[reverse]'#[noreverse] ,   }}}"
# Jump to a waiting Claude, or say that none is waiting
bind -n M-\' if -F '#{S:#{W:#{P:#{?#{E:@waiting_any_claude},x,}}}}' "display-popup -E ',tmux-pick-waiting-claude'" "display-message 'No Claude waits for input'"
