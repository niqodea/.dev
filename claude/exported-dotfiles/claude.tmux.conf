# Claude Code next to the current pane, at most one per session
bind -n M-\; run-shell ',tmux-open-claude'
# Whether a pane is a Claude that waits for us
set -g @waiting_claude '#{&&:#{==:#{@pane_type},claude},#{==:#{@status},idle}}'
# Show the key that reaches a waiting Claude: ; for the Claude in this session, ' for a Claude in another session
# Show three spaces when no Claude waits, so whatever we add before them stays put
set -g @module_status "#{?#{W:#{P:#{?#{E:@waiting_claude},x,}}},#[reverse] ; #[noreverse],#{?#{S:#{W:#{P:#{?#{E:@waiting_claude},x,}}}},#[reverse] ' #[noreverse],   }}"
# Jump to a waiting Claude, or say that none is waiting
bind -n M-\' if -F '#{S:#{W:#{P:#{?#{E:@waiting_claude},x,}}}}' "display-popup -E ',tmux-pick-waiting-claude'" "display-message 'No Claude waits for input'"
