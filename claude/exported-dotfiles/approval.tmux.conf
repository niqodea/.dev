# Every session gets its own approval queue, named by its ID and creation time, since tmux reuses IDs after a restart, and without the $, since the name becomes a directory
set-hook -g session-created 'set-environment -F APPROVAL_QUEUE "#{s/[$]//:session_id}-#{session_created}"'
# Opens this session's approval queue when a request waits in it, to approve or refuse it
# A failing count prints nothing, which opens the popup, so its error shows there, and -EE keeps the popup open when a command fails
bind -n M-y if-shell '[ "$(,approval count)" != 0 ]' "display-popup -EE -w 80% -h 80% ',approval-answer'" "display-message 'No request waits in this session'"
