# The approval queue of the session's project next to the current pane, at most one per session, to approve or refuse what waits in it
bind -n M-y run-shell ',tmux-open-approval'
# Show y, the key that opens the queue, when a request waits in the session's project, and three spaces otherwise, so whatever we add before them stays put
# The approval on-change hook keeps the count in @approval_waiting as it changes
set -ga @module_status "#{?#{e|>:#{@approval_waiting},0}, #[reverse]y#[noreverse] ,   }"
# A session made after a restart learns what already waits in its project
# The empty quotes keep the home session's name from expanding to the home path
set-hook -g session-created "run-shell \"~/.config/approval/on-change ''#{q:session_name}\""
