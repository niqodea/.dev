# Opens the approval queue of the session's project when a request waits in it, to approve or refuse it
# A failing count prints nothing, which opens the popup, so its error shows there, and -EE keeps the popup open when a command fails
bind -n M-y if-shell '[ "$(,approval count)" != 0 ]' "display-popup -EE -w 80% -h 80% ',approval-answer'" "display-message 'No request waits in this project'"
