# The approval queue of the session's project next to the current pane, at most one per session, to approve or refuse what waits in it
bind -n M-y run-shell ',tmux-open-approval'
# Show y, the key that opens the queue, when a request waits in the session's project, whose name a project's session has
# The empty quotes keep the home session's name from expanding to the home path
set -ga @module_status "#(,tmux-format-approval ''#{q:session_name})"
