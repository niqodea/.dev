[package]
name = "approval"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
clap = { version = "4.5", features = ["derive"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-properties = { version = "0.1", default-features = false, features = ["general-category"] }

[lints.clippy]
pedantic = "warn"
