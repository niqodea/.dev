[package]
name = "plain"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
# At the version edtui uses, whose key events it takes
crossterm = "0.29"
# The input box's vi keys, without its clipboard, mouse and syntax highlighting
edtui = { version = "0.11.7", default-features = false }
libc = "0.2"
# The cells edtui draws the input box into
ratatui-core = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Only the grammars and a regex engine in Rust, since the terminal's own colors replace its themes
syntect = { version = "5", default-features = false, features = ["default-syntaxes", "regex-fancy"] }
unicode-width = "0.2"
uuid = { version = "1", features = ["v4"] }

[lints.clippy]
pedantic = "warn"
