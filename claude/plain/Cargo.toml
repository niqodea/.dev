[package]
name = "plain"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
libc = "0.2"
nu-ansi-term = "0.50"
# A prompt row of its own stays on screen above every printed line in reedline 0.52.1, which
# the commit pinned here fixes
# Ref: https://github.com/nushell/reedline/pull/1243
# TODO: Depend on the first release that holds the fix instead of this commit
reedline = { git = "https://github.com/nushell/reedline", rev = "c9fcec8a91b034b21fc89fd77aa54a07569ee3c3" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Only the grammars and a regex engine in Rust, since the terminal's own colors replace its themes
syntect = { version = "5", default-features = false, features = ["default-syntaxes", "regex-fancy"] }
unicode-width = "0.2"
uuid = { version = "1", features = ["v4"] }

[lints.clippy]
pedantic = "warn"
